name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-pipeline:
    name: Build, Test, and Deploy the Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run backend tests
        working-directory: ./backend
        run: |
          echo "Running unit tests for the backend service..."
          go mod tidy
          go test ./internal/service/... -v -cover

      - name: Build Docker images
        uses: docker/setup-buildx-action@v3

      - name: Build stack with Docker Compose
        run: docker compose build

      - name: Start the application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          echo "Waiting for the backend to be ready..."
          timeout 60 bash -c 'until curl -fs http://localhost:8080/webanalyzer/api/v1/health; do echo "Still starting up..."; sleep 2; done' \
            || (echo "Backend failed health check." && docker compose logs && exit 1)

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== Backend Logs ====="
          docker compose logs
          echo "===== Container Status ====="
          docker compose ps

      - name: Clean up
        if: always()
        run: docker compose down -v
